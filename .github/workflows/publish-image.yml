name: Publish ARM64 builder image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-builder-image
  cancel-in-progress: false

jobs:
  publish:
    # Native ARM64 runner: no slow QEMU emulation and no Android source checkout.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "tag=$image:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load for testing
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/arm64
          load: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=axion-builder-arm64
          cache-to: type=gha,mode=max,scope=axion-builder-arm64

      - name: Smoke-test native tools
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          docker run --rm "$IMAGE" bash -e -c '
            test "$(uname -m)" = aarch64
            /usr/bin/python3 -c "import ssl; print(ssl.OPENSSL_VERSION)"
            javac -version
            command -v repo git git-lfs make cmake ninja lz4 pahole ccache
            git lfs version
          '

      - name: Push tested image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=axion-builder-arm64

      - name: Publish usage
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          {
            echo '## ARM64 builder image published'
            echo "- Image: \`$IMAGE\`"
            echo "- Run \`./axion-builder pull\` instead of building locally."
            echo '- This publishes build dependencies, not the ROM, sources, blobs, or keys.'
            echo '- GHCR packages may start private: set the package visibility to Public once for anonymous pulls.'
          } >> "$GITHUB_STEP_SUMMARY"
