name: Publish ARM64 builder image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-builder-image
  cancel-in-progress: false

jobs:
  publish:
    # Native ARM64 runner: no slow QEMU emulation and no Android source checkout.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and tags
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          {
            echo "stable=$image:24.04-arm64"
            echo "revision=$image:sha-${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker
          platforms: linux/arm64
          load: true
          tags: ${{ steps.image.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=axion-builder-arm64
          cache-to: type=gha,mode=max,scope=axion-builder-arm64

      - name: Smoke-test native tools
        env:
          IMAGE: ${{ steps.image.outputs.revision }}
        run: |
          docker run --rm "$IMAGE" bash -e -c '
            test "$(uname -m)" = aarch64
            /usr/bin/python3 -c "import ssl; print(ssl.OPENSSL_VERSION)"
            javac -version
            command -v repo git git-lfs make cmake ninja lz4 pahole ccache
            git lfs version
          '

      - name: Push tested image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.stable }}
            ${{ steps.image.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=axion-builder-arm64

      - name: Publish usage
        env:
          IMAGE: ${{ steps.image.outputs.stable }}
          REVISION: ${{ steps.image.outputs.revision }}
        run: |
          {
            echo '## ARM64 builder image published'
            echo "- Stable: \`$IMAGE\`"
            echo "- Revision: \`$REVISION\`"
            echo "- Run \`./axion-builder pull\` instead of building locally."
            echo '- This publishes build dependencies, not the ROM, sources, blobs, or keys.'
            echo '- GHCR packages may start private: set the package visibility to Public once for anonymous pulls.'
          } >> "$GITHUB_STEP_SUMMARY"
